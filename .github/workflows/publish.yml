name: publish

# Publishes to npm when a GitHub release is published, using npm trusted
# publishing (OIDC): no NPM_TOKEN and no OTP. The trusted publisher is
# registered on npmjs.com for this repository and this exact workflow file
# name. Renaming this file stops publishing until it is registered again
# (npm trust github signalk-m510e-connector --file publish.yml
#  --repo BoatHacks/signalk-m510e-connector --allow-publish).
#
# Release steps: bump the version in package.json, update CHANGELOG.md,
# commit, tag vX.Y.Z, push, then create the GitHub release for that tag.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets the job request the OIDC token npm trusts

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5.1 or newer is needed for OIDC publishing

      - name: Release tag must match the version in package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm publish
